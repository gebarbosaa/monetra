name: MONETRA CI

on:
  push:
    branches: [dev, 'infra/**']
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: monetra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, unit tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Backend lint-rule tests
        run: npm run test:lint-rules --workspace=packages/backend

      - name: Backend unit tests
        run: npm run test:unit --workspace=packages/backend

      - name: Frontend unit tests
        run: npm run test:unit --workspace=packages/frontend -- --run

      - name: Build frontend
        run: npm run build --workspace=packages/frontend
